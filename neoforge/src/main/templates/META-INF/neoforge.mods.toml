modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
NeroRuins - multiloader build (NeoForge).
'''

${mod_mixin_entry}

[[dependencies.${mod_id}]]
modId = "neoforge"
${required_dependency}
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
${required_dependency}
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE NeroRuins (ordering = AFTER).
# Core is the ONLY hard dependency: every other Nero mod stays soft and is detected at runtime.
[[dependencies.${mod_id}]]
modId = "nerolandcore"
${required_dependency}
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"
